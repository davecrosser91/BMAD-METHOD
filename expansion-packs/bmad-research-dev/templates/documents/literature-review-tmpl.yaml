instructions: |
  This template creates a comprehensive literature review combining academic and industry sources.

  Required elicitation:
  - topic: Topic being reviewed (e.g., "Transformer Optimization")
  - topic-slug: URL-friendly slug (e.g., "transformer-optimization")
  - date: Current date (YYYY-MM-DD)
  - tag1, tag2: Topic tags

  Agent should:
  1. Use 3-mode literature search (Web, Academic, Local)
  2. Gather sources systematically
  3. Fill in all sections with specific findings
  4. Include both research and business perspectives
  5. Update frontmatter sources_count with actual count
  6. Save to docs/research/literature-reviews/review-{topic-slug}.md
  7. Suggest creating research proposal based on findings
