output: docs/research/literature-reviews/review-{topic-slug}.md
frontmatter:
  type: literature-review
  title: "Literature Review: {topic}"
  status: active
  created: "{date}"
  updated: "{date}"
  tags: ["{tag1}", "{tag2}"]
  sources_count: 0
  related_docs: null
sections:
  - name: title
    heading: "# Literature Review: {topic}"

  - name: overview
    heading: "## Overview"
    content: |
      **Topic:** {topic}

      **Review Date:** {date}

      **Search Strategy:**
      - Web Search (industry blogs, documentation)
      - Academic Search (arXiv, Google Scholar)
      - Local Documentation (previous research)

      **Total Sources:** [TO BE FILLED]

      **Key Findings Summary:** (2-3 paragraphs)

  - name: search_methodology
    heading: "## Search Methodology"
    content: |
      ### Search Queries Used
      1. Query 1: "{query1}"
      2. Query 2: "{query2}"

      ### Sources Searched
      - ✅ Web: Google, tech blogs, documentation
      - ✅ Academic: arXiv.org (via site:arxiv.org searches)
      - ✅ Local: docs/research/

      ### Inclusion Criteria
      - Relevant to: {criteria}
      - Published: {date_range}
      - Quality: Peer-reviewed or reputable source

      ### Exclusion Criteria
      - Not relevant to core topic
      - Outdated (> 5 years old for fast-moving fields)
      - Low-quality sources

  - name: key_papers
    heading: "## Key Papers & Resources"
    subsections:
