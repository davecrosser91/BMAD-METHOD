          - **Relevance:** Why it matters for our work
          - **Strengths:** What it does well
          - **Limitations:** What it doesn't address

      - name: recent_advances
        heading: "### Recent Advances"
        content: |
          State-of-the-art methods (last 2 years).

          #### [Paper 2 Title] (Year)
          - **Authors:** Author list
          - **Venue:** Conference/Journal
          - **URL:** [Link]
          - **Key Contribution:** What's new
          - **Results:** Key findings
          - **Relevance:** How it relates to our work

      - name: related_approaches
        heading: "### Related Approaches"
        content: |
          Alternative methods and approaches.

          #### [Approach 1]
          - **Description:** What it is
          - **Strengths:** Advantages
          - **Weaknesses:** Limitations
          - **Comparison:** How it compares to our approach

